<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Escala</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 15px; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #1a365d; margin-bottom: 20px; font-size: 22px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #4a5568; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 15px; }
    button { width: 100%; padding: 12px; background-color: #2b6cb0; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #2c5282; }
    .legend { display: flex; justify-content: space-around; margin: 20px 0 10px; font-size: 13px; font-weight: 600; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .box { width: 14px; height: 14px; border-radius: 3px; }
    .box.trabalho { background-color: #e53e3e; }
    .box.folga { background-color: #38a169; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; text-align: center; }
    .day-header { font-weight: bold; font-size: 12px; color: #718096; padding: 5px 0; }
    .day { padding: 10px 2px; border-radius: 6px; font-size: 14px; font-weight: 600; background-color: #edf2f7; color: #4a5568; }
    .day.trabalho { background-color: #fed7d7; color: #9b2c2c; border: 1fr solid #feb2b2; }
    .day.folga { background-color: #c6f6d5; color: #22543d; border: 1fr solid #9ae6b4; }
    .day.empty { background-color: transparent; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🗓️ Minha Escala</h1>
    <div class="form-group">
      <label for="startDate">Data do Primeiro Dia de TRABALHO:</label>
      <input type="date" id="startDate">
    </div>
    <div class="form-group">
      <label for="scaleType">Tipo de Escala:</label>
      <select id="scaleType">
        <option value="12x36">12x36 (Trabalha 1, Folga 1)</option>
        <option value="6x1">6x1 (Trabalha 6, Folga 1)</option>
        <option value="5x2">5x2 (Trabalha 5, Folga 2)</option>
      </select>
    </div>
    <button onclick="generateCalendar()">Gerar Calendário</button>
    <div class="legend">
      <div class="legend-item"><div class="box trabalho"></div> Trabalho</div>
      <div class="legend-item"><div class="box folga"></div> Folga</div>
    </div>
    <div class="calendar-grid" id="calendar"></div>
  </div>
  <script>
    function generateCalendar() {
      const startInput = document.getElementById('startDate').value;
      const scaleType = document.getElementById('scaleType').value;
      const calendar = document.getElementById('calendar');
      calendar.innerHTML = '';
      if (!startInput) { alert('Por favor, selecione a data inicial!'); return; }
      const startDate = new Date(startInput + 'T00:00:00');
      const year = startDate.getFullYear();
      const month = startDate.getMonth();
      const headers = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      headers.forEach(h => {
        const div = document.createElement('div');
        div.className = 'day-header';
        div.innerText = h;
        calendar.appendChild(div);
      });
      const firstDayOfMonth = new Date(year, month, 1);
      const startingDay = firstDayOfMonth.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      for (let i = 0; i < startingDay; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'day empty';
        calendar.appendChild(emptyDiv);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const currentDate = new Date(year, month, day);
        const dayDiv = document.createElement('div');
        dayDiv.className = 'day';
        dayDiv.innerText = day;
        if (currentDate >= startDate) {
          const diffDays = Math.floor((currentDate - startDate) / (1000 * 60 * 60 * 24));
          let isWork = false;
          if (scaleType === '12x36') {
            isWork = diffDays % 2 === 0;
          } else if (scaleType === '6x1') {
            isWork = diffDays % 7 !== 6;
          } else if (scaleType === '5x2') {
            isWork = diffDays % 7 < 5;
          }
          dayDiv.classList.add(isWork ? 'trabalho' : 'folga');
        }
        calendar.appendChild(dayDiv);
      }
    }
  </script>
</body>
</html>
